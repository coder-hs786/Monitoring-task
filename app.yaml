apiVersion: v1
kind: ConfigMap
metadata:
  name: monitoring-app-page
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
      <title>Monitoring Application</title>
    </head>
    <body>
      <h1>Monitoring Application</h1>
      <h2>CloudWatch | Prometheus | Grafana</h2>
      <p>Kubernetes application is running successfully.</p>
    </body>
    </html>

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitoring-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: monitoring-app
  template:
    metadata:
      labels:
        app: monitoring-app
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          volumeMounts:
            - name: webpage
              mountPath: /usr/share/nginx/html
      volumes:
        - name: webpage
          configMap:
            name: monitoring-app-page

---
apiVersion: v1
kind: Service
metadata:
  name: monitoring-app-service
spec:
  type: NodePort
  selector:
    app: monitoring-app
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
